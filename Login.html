<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #e85c50;
    }
    .message {
      margin-top: 15px;
      font-size: 14px;
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Enter Username" required>
    <input type="password" id="password" placeholder="Enter Password" required>
    <button onclick="saveLogin()">Login</button>
    <div id="msg" class="message"></div>
  </div>

  <script>
    function saveLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("msg");

      if (!username || !password) {
        msg.textContent = "Please fill in all fields.";
        msg.className = "message error";
        return;
      }

      // Retrieve saved logins from localStorage
      let savedLogins = JSON.parse(localStorage.getItem("logins")) || [];

      // Check if this combination already exists
      const exists = savedLogins.some(
        login => login.username === username && login.password === password
      );

      if (exists) {
        msg.textContent = "These login details already exist. Try different ones.";
        msg.className = "message error";
      } else {
        savedLogins.push({ username, password });
        localStorage.setItem("logins", JSON.stringify(savedLogins));
        msg.textContent = "Login successful and saved!";
        msg.className = "message";
      }

      // Clear fields
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }
  </script>
</body>
</html>
