<html>
<head>
<title>Postioning using Css</title>
<style>
.parent{color:green;background-color:color:orange;font.size:25px;padding:20px;height;200rh;}
.child-one{background-color:yellow;position:relative;left:30px;}
.child-two{background-color:pink;position:absolute;bottom:20px;}
.child-three{background-color:blue;position:fixed;right:50px;}
</style>
</head>
<body>
<div class="parent">parent</div>
<div class="child-one">ONE</div>
<div class="child-two">TWO</div>
<div class="child-three">Three</div>
</body>
</html>
